# tg-download-bot Docker Compose 部署
# 用法：
#   1. 准备配置：cp config.example.yaml config.yaml && 编辑 secrets.yaml（密钥）
#   2. 启动（自动从 Docker Hub 拉取镜像）：docker compose up -d
#   3. 看日志：docker compose logs -f
# 离线/内网环境：docker load < tg-download-bot-0.1.0.tar.gz 后，去掉下面 build 段的注释即可

services:
  tg-download-bot:
    image: bin12121/tg-download-bot:latest
    # 如需本地构建（改过代码时）：
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: tg-download-bot
    restart: unless-stopped
    volumes:
      # 配置（只读挂载；secrets.yaml 含密钥，勿提交 git）
      - ./config.yaml:/app/config.yaml:ro
      - ./secrets.yaml:/app/secrets.yaml:ro
      # 运行时数据：session/下载/日志/历史
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
