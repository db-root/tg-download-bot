# ============ tg-media-bot 密钥配置模板 ============
# 用法：复制为 secrets.yaml 并填写真实值
#   cp secrets.example.yaml secrets.yaml
# ⚠️ 本文件含敏感凭据，请勿提交 git / 公开仓库 / 分享给他人

# ---------------- api_id / api_hash（必填）----------------
# 获取步骤：
#   1. 登录 https://my.telegram.org
#   2. 点 "API development tools" → "Create new application"
#   3. 表单随意填（App title / Short name 用字母数字，URL 可留空，Platform 选 Desktop）
#   4. 创建成功后页面显示：
#        App api_id:   12345678            ← 数字
#        App api_hash: 32位十六进制字符串   ← 如 4b9c1d2e3f4a5b6c7d8e9f0a1b2c3d4e
#
# ⚠️⚠️ 特别声明：my.telegram.org 需要【纯净的境外 IP】才能正常访问！
#   - 国内 IP / 被污染的代理出口 / 虚拟号注册的账号会被拒绝，页面只报通用 ERROR
#   - 测试你的 IP 是否纯净：https://ipdata.co/（看网络类型 / 威胁等级 / 是否数据中心IP）
#   - 报 ERROR（HTTP 200 + 响应体纯文本 ERROR）时依次排查：
#     ① 换纯净境外 IP（代理要能正常访问 my.telegram.org）
#     ② 手机号验证码是否完成（首次会发到 Telegram 官方会话）
#     ③ 账号是否虚拟号/接码平台注册（这类号无法创建应用，需换真实手机号账号）
#     ④ 同一 IP 频繁操作被风控 → 等待几小时
api_id: 0
api_hash: ""

# ---------------- bot_token（必填）----------------
# 获取：Telegram 内搜索 @BotFather → 发送 /newbot → 按提示设置
#   显示名随便，用户名必须以 bot 结尾（如 my_download_bot）
#   创建成功会返回 token，形如：
#     123456789:AAHxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx   （数字:字母数字串，无省略号）
bot_token: ""

# ---------------- SSH 密码（可选，rsync 目标认证用）----------------
# 键 = config.yaml 中 targets 的目标名，值 = 该服务器的 SSH 密码
# 例：
# ssh_passwords:
#   飞机: "你的密码"
#   电视剧: "你的密码"
ssh_passwords: {}

# ---------------- SSH 密钥（可选，优先级高于密码）----------------
# 填私钥绝对路径（如 /root/.ssh/id_ed25519）；留空则用上面 ssh_passwords 密码认证
ssh_key: ""
